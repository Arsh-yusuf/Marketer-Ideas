<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA24C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>

  <!-- Modern Dynamic Icon: Idea Spark + Growth Arrow -->
  <g transform="translate(10, 10)">
    <!-- Rounded Background Glow/Badge -->
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#0B0F17" />
    <rect x="0" y="0" width="60" height="60" rx="14" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.3" />
    
    <!-- Ascending Growth Bars (Digital Marketing Performance) -->
    <rect x="12" y="36" width="6" height="14" rx="2" fill="#F97316" fill-opacity="0.5" />
    <rect x="22" y="28" width="6" height="22" rx="2" fill="#F97316" fill-opacity="0.8" />
    <rect x="32" y="18" width="6" height="32" rx="2" fill="url(#orangeGrad)" />
    
    <!-- Idea Spark / Upward Dynamic Trajectory -->
    <path d="M42 16L48 22M48 16L42 22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <circle cx="45" cy="19" r="1.5" fill="#FFA24C" />

    <!-- Connecting Growth Line -->
    <path d="M15 34L25 26L35 16L45 12" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M38 12H45V19" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: MARKETER IDES -->
  <g transform="translate(82, 42)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="25" letter-spacing="-0.5" fill="currentColor">
      MARKETER
    </text>
    <text x="144" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="25" letter-spacing="-0.5" fill="#F97316">
      IDES
    </text>
  </g>

  <!-- Subtitle: DIGITAL MARKETING & FREELANCING AGENCY -->
  <text x="83" y="60" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="7.5" letter-spacing="1.8" fill="#F97316">
    DIGITAL MARKETING &amp; FREELANCING AGENCY
  </text>
</svg>
